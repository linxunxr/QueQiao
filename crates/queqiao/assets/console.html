<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鹊桥控制台 · 设置</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a323c; --fg:#dbe2ea; --dim:#8a97a5; --acc:#4da3ff; --ok:#3fbf6f; --warn:#e8b04a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:17px; margin:0; }
  header .ver { color:var(--dim); font-size:12px; }
  main { max-width:860px; margin:0 auto; padding:20px 22px 80px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  section h2 { font-size:14px; margin:0 0 12px; color:var(--acc); border-bottom:1px dashed var(--line); padding-bottom:8px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .field { flex:1 1 220px; margin-bottom:10px; }
  .field label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .field input, .field select { width:100%; background:#0d1114; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:7px 9px; font-size:13px; }
  .field input:focus { outline:none; border-color:var(--acc); }
  .hint { font-size:12px; color:var(--dim); margin-top:2px; }
  textarea { width:100%; min-height:320px; background:#0d1114; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:10px; font:12px/1.5 Consolas,monospace; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:12px; align-items:center; justify-content:center; }
  button { background:var(--acc); color:#08151f; border:none; border-radius:6px; padding:9px 26px; font-size:14px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); padding:9px 20px; border-radius:8px; font-size:13px; display:none; }
  #toast.ok { background:#153f28; color:var(--ok); border:1px solid var(--ok); }
  #toast.err { background:#43161a; color:#ff8a8f; border:1px solid #ff8a8f; }
  .tag { display:inline-block; background:#0d1114; border:1px solid var(--line); border-radius:4px; padding:1px 7px; margin:2px 4px 2px 0; font-size:12px; }
  .tag b { cursor:pointer; color:var(--dim); margin-left:5px; font-weight:normal; }
  .chips { display:flex; gap:8px; }
  .chips input { flex:1; background:#0d1114; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 9px; }
</style>
</head>
<body>
<header><h1>鹊桥 · 设置</h1><span class="ver" id="ver"></span><span class="hint" id="mode"></span></header>
<main>
  <section>
    <h2>基础</h2>
    <div class="row">
      <div class="field"><label>管理员 QQ（ownerQQ）</label><input id="f-ownerQQ" placeholder="如 3388404701"><div class="hint">AI 只回应这个人的管理指令</div></div>
    </div>
    <div class="field"><label>允许的群（allow.groups）— AI 只参与列出的群</label>
      <div class="chips"><input id="add-group" placeholder="输入群号后回车添加"><button class="ghost" onclick="addChip('groups')">添加</button></div>
      <div id="chips-groups"></div></div>
    <div class="field"><label>允许的私聊（allow.private）</label>
      <div class="chips"><input id="add-private" placeholder="输入 QQ 号后回车添加"><button class="ghost" onclick="addChip('private')">添加</button></div>
      <div id="chips-private"></div></div>
  </section>

  <section>
    <h2>SnowLuma（QQ 网关）</h2>
    <div class="row">
      <div class="field"><label>主目录（homeDir）</label><input id="f-slHome" placeholder="如 C:\Users\你\SnowLuma"><div class="hint">token 自动发现的数据源；留空则用环境变量</div></div>
    </div>
  </section>

  <section>
    <h2>DSH（AI 侧）</h2>
    <div class="row">
      <div class="field"><label>基址（baseUrl）</label><input id="f-dshBase" placeholder="http://127.0.0.1:3080"><div class="hint">探活失败会自动扫描端口</div></div>
      <div class="field"><label>模型（model）</label><input id="f-dshModel" placeholder="留空用 DSH 当前模型"></div>
    </div>
  </section>

  <section>
    <h2>行为</h2>
    <div class="row">
      <div class="field"><label>每分钟唤醒上限</label><input id="f-wakeMin" type="number" min="0"></div>
      <div class="field"><label>每小时唤醒上限</label><input id="f-wakeHour" type="number" min="0"></div>
      <div class="field"><label>单条消息长度上限</label><input id="f-maxChars" type="number" min="1"></div>
      <div class="field"><label>合批窗口（毫秒）</label><input id="f-batch" type="number" min="1000"></div>
      <div class="field"><label>日记</label><select id="f-diary"><option value="true">开启（每晚定点写）</option><option value="false">关闭</option></select></div>
      <div class="field"><label>主动发言</label><select id="f-proactive"><option value="true">开启（安静时偶尔冒泡）</option><option value="false">关闭</option></select></div>
    </div>
  </section>

  <section>
    <h2>高级（完整 JSON）</h2>
    <div class="hint" style="margin-bottom:8px">上面未覆盖的全部字段在此编辑（约 200 个键，留空即默认值）；保存前会做完整校验，解析失败不会写入。</div>
    <textarea id="f-json" spellcheck="false"></textarea>
  </section>
</main>
<div class="bar">
  <button onclick="save()">保存并生效</button>
  <span class="hint" id="status"></span>
</div>
<div id="toast"></div>
<script>
let cfg = null;
const chipLists = { groups: [], private: [] };

async function load() {
  const r = await fetch('/api/config');
  cfg = await r.json();
  document.getElementById('ver').textContent = 'queqiao ' + (cfg._version || '');
  document.getElementById('mode').textContent = cfg._firstRun ? '· 首次设置：完成后保存即可启动' : '';
  const v = (id, val) => { const el = document.getElementById(id); if (el !== null) el.value = val ?? ''; };
  v('f-ownerQQ', cfg.ownerQQ);
  v('f-slHome', cfg.snowluma && cfg.snowluma.homeDir);
  v('f-dshBase', cfg.dsh && cfg.dsh.baseUrl);
  v('f-dshModel', cfg.dsh && cfg.dsh.model);
  const wake = (cfg.socialV2 && cfg.socialV2.wake) || {};
  const send = (cfg.socialV2 && cfg.socialV2.send) || {};
  v('f-wakeMin', wake.maxWakePerMinute); v('f-wakeHour', wake.maxWakePerHour);
  v('f-maxChars', send.maxMessageChars); v('f-batch', wake.batchWindowMs);
  const di = document.getElementById('f-diary'); if (cfg.socialV2 && cfg.socialV2.diary) di.value = String(!!cfg.socialV2.diary.enabled);
  const pr = document.getElementById('f-proactive'); if (cfg.socialV2 && cfg.socialV2.proactive) pr.value = String(!!cfg.socialV2.proactive.enabled);
  chipLists.groups = ((cfg.allow && cfg.allow.groups) || []).map(String);
  chipLists.private = ((cfg.allow && cfg.allow.private) || []).map(String);
  renderChips();
  document.getElementById('f-json').value = JSON.stringify(stripUi(cfg), null, 2);
  document.getElementById('status').textContent = cfg._firstRun ? '等待首次保存…' : '已加载当前配置';
}
function stripUi(o) { const c = { ...o }; delete c._version; delete c._firstRun; return c; }
function renderChips() {
  for (const k of ['groups', 'private']) {
    const box = document.getElementById('chips-' + k);
    box.innerHTML = chipLists[k].map((x, i) =>
      `<span class="tag">${x}<b onclick="chipLists['${k}'].splice(${i},1);renderChips()">✕</b></span>`).join('') || '<span class="hint">（空）</span>';
  }
}
function addChip(k) {
  const inp = document.getElementById('add-' + k);
  const val = inp.value.trim().replace(/[^0-9]/g, '');
  if (val && !chipLists[k].includes(val)) { chipLists[k].push(val); renderChips(); }
  inp.value = '';
}
document.getElementById('add-group').addEventListener('keydown', e => { if (e.key === 'Enter') addChip('groups'); });
document.getElementById('add-private').addEventListener('keydown', e => { if (e.key === 'Enter') addChip('private'); });

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = ok ? 'ok' : 'err'; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
}
async function save() {
  const status = document.getElementById('status');
  status.textContent = '校验中…';
  let body;
  try { body = JSON.parse(document.getElementById('f-json').value); }
  catch (e) { toast('JSON 解析失败：' + e.message, false); status.textContent = ''; return; }
  const num = id => { const v = document.getElementById(id).value; return v === '' ? undefined : Number(v); };
  body.ownerQQ = document.getElementById('f-ownerQQ').value.trim() === '' ? null : Number(document.getElementById('f-ownerQQ').value.trim()) || null;
  body.snowluma = body.snowluma || {};
  body.snowluma.homeDir = document.getElementById('f-slHome').value.trim();
  body.dsh = body.dsh || {};
  body.dsh.baseUrl = document.getElementById('f-dshBase').value.trim() || 'http://127.0.0.1:3080';
  body.dsh.model = document.getElementById('f-dshModel').value.trim();
  body.allow = body.allow || {};
  body.allow.groups = chipLists.groups.map(Number);
  body.allow.private = chipLists.private.map(Number);
  body.socialV2 = body.socialV2 || {};
  body.socialV2.wake = body.socialV2.wake || {};
  if (num('f-wakeMin') !== undefined) body.socialV2.wake.maxWakePerMinute = num('f-wakeMin');
  if (num('f-wakeHour') !== undefined) body.socialV2.wake.maxWakePerHour = num('f-wakeHour');
  if (num('f-batch') !== undefined) body.socialV2.wake.batchWindowMs = num('f-batch');
  body.socialV2.send = body.socialV2.send || {};
  if (num('f-maxChars') !== undefined) body.socialV2.send.maxMessageChars = num('f-maxChars');
  body.socialV2.diary = body.socialV2.diary || {}; body.socialV2.diary.enabled = document.getElementById('f-diary').value === 'true';
  body.socialV2.proactive = body.socialV2.proactive || {}; body.socialV2.proactive.enabled = document.getElementById('f-proactive').value === 'true';
  const r = await fetch('/api/config', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const res = await r.json();
  if (res.ok) {
    toast('已保存并生效', true); status.textContent = '已保存 · ' + new Date().toLocaleTimeString();
    if (res.restartHint) status.textContent += '（首次设置完成，桥正在启动…）';
    setTimeout(load, 600);
  } else { toast('保存失败：' + (res.error || '未知错误'), false); status.textContent = ''; }
}
load();
</script>
</body>
</html>
