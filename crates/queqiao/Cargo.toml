[package]
name = "queqiao"
description = "鹊桥：QQ ↔ DeepSeek Harness 桥接主程序（Rust 版）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "queqiao"
path = "src/main.rs"

[dependencies]
queqiao-core = { path = "../queqiao-core" }
queqiao-onebot = { path = "../queqiao-onebot", features = ["io"] }
queqiao-dsh = { path = "../queqiao-dsh", features = ["reqwest", "ws"] }
queqiao-media = { path = "../queqiao-media" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# 集成测试用 oneshot 直打路由（进程内验证工具面端点，不占端口）。
tower = { version = "0.5", features = ["util"] }
