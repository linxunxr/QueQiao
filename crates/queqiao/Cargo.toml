[package]
name = "queqiao"
description = "鹊桥：QQ ↔ DeepSeek Harness 桥接主程序（Rust 版）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "queqiao"
path = "src/main.rs"

[dependencies]
queqiao-core = { path = "../queqiao-core" }
queqiao-onebot = { path = "../queqiao-onebot", features = ["io"] }
queqiao-dsh = { path = "../queqiao-dsh", features = ["reqwest", "ws"] }
queqiao-media = { path = "../queqiao-media" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# consoleToken 密码学随机生成（lock 内已有 0.3 传递实例，无新增编译单元）。
getrandom = "0.3"
# 人格卡内容修订号（sha256 前 8 hex，跨版本稳定；dsh 已用同 workspace 依赖）。
sha2 = { workspace = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 长期记忆语义检索（M7 二期）：sqlite-vec 向量表 + 本地中文小模型
#（fastembed candle BERT 后端，CPU 推理，无外部服务/无 onnxruntime DLL）。
sqlite-vec = "0.1.9"
fastembed = { version = "7.7", default-features = false, features = ["bert-text", "hf-hub-rustls-tls"] }
candle-core = "0.11"

[dev-dependencies]
# 集成测试用 oneshot 直打路由（进程内验证工具面端点，不占端口）。
tower = { version = "0.5", features = ["util"] }
