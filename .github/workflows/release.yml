# Release：打 v* tag 时构建并上传 Windows 产物到 GitHub Release。
# 产物只含本仓库 MIT 代码编译的 exe 与配套脚本/声明——不包含、不下载、
# 不内嵌 SnowLuma 任何组件（A 档授权边界：不捆绑进第三方安装包；
# SnowLuma 由使用者自行从官方渠道获取，见包内安装说明）。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '追加产物的已有 tag（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 产物并上传 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建（release，全 workspace 含客户端）
        run: cargo build --release

      - name: 真桥 exe 拷入客户端 bundle 资源（覆盖占位）
        shell: pwsh
        run: |
          Copy-Item target/release/queqiao.exe crates/queqiao-app/binaries/ -Force
          Copy-Item target/release/queqiao-mcp.exe crates/queqiao-app/binaries/ -Force

      - name: 组包
        shell: pwsh
        run: |
          $Tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $Stage = "stage/$Tag"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          # 双 exe + 部署脚本 + 许可与声明（宽松许可的声明保留义务随二进制履行）。
          Copy-Item target/release/queqiao.exe $Stage
          Copy-Item target/release/queqiao-mcp.exe $Stage
          Copy-Item target/release/queqiao-app.exe $Stage
          Copy-Item install.ps1 $Stage
          Copy-Item install.bat $Stage
          Copy-Item upgrade.bat $Stage
          New-Item -ItemType Directory -Force -Path "$Stage/scripts" | Out-Null
          Copy-Item scripts/upgrade.ps1 "$Stage/scripts/"
          # preset 随包分发（安装器部署到 ~/.dsh/agent-presets）。
          New-Item -ItemType Directory -Force -Path "$Stage/dsh/agent-presets" | Out-Null
          Copy-Item dsh/agent-presets/* "$Stage/dsh/agent-presets/" -Recurse
          Copy-Item LICENSE $Stage
          Copy-Item THIRD_PARTY_NOTICES.md $Stage
          Copy-Item migrate-from-node.ps1 $Stage
          @'
          鹊桥（QueQiao）安装说明
          ========================

          本包只包含鹊桥自身（MIT 许可）的可执行文件与部署脚本。
          运行需要自备以下组件（本包不含、也不代替你获取它们）：

          1. SnowLuma 官方发行包——从官方渠道下载安装（见 README 链接），
             登录目标 QQ 并开启 OneBot 服务；使用者须遵守 SnowLuma EULA/LICENSE。
          2. DeepSeek Harness（DSH）——已安装并初始化（~/.dsh 存在）。
          3. config.json——参照仓库 README「快速上手」准备，放到 exe 同目录。

          全新安装：解压后双击 install.bat（引导安装 DSH/SnowLuma、部署 preset、
          生成 config、注册 MCP；也可命令行 install.ps1，参数见脚本头部）
          升级部署：双击 upgrade.bat
          （构建 + dist 布局 + DSH preset 注册；也可直接用本包已构建的 exe）。
          详见仓库 README：https://github.com/linxunxr/QueQiao
          # 文件名用 ASCII：PS5.1 Compress-Archive 不打 UTF-8 名标志，中文名
          # 在非中文系统解压乱码（内容仍是中文）。
          '@ | Out-File "$Stage/INSTALL-NOTES.txt" -Encoding utf8
          Compress-Archive -Path "$Stage/*" -DestinationPath "queqiao-$Tag-win64.zip" -Force
          Get-Item "queqiao-$Tag-win64.zip"
          # 更新日志：从 CHANGELOG.md 提取本版本段落作为 Release body——更新
          # 检查（桥/客户端）读的就是 Release body，为空则用户更新时看不到
          # 更新了什么（v0.4.x 全部 Release body 为空的根因即此步骤曾缺失）。
          $Ver = $Tag.TrimStart('v')
          $Lines = Get-Content CHANGELOG.md -Encoding UTF8
          $Start = -1
          for ($i = 0; $i -lt $Lines.Count; $i++) {
            if ($Lines[$i] -match ('^## \[' + [regex]::Escape($Ver) + '\]')) { $Start = $i; break }
          }
          if ($Start -ge 0) {
            $End = $Lines.Count
            for ($i = $Start + 1; $i -lt $Lines.Count; $i++) {
              if ($Lines[$i] -match '^## \[') { $End = $i; break }
            }
            ($Lines[$Start..($End - 1)] -join [Environment]::NewLine) |
              Out-File release-body.md -Encoding utf8
            Write-Output ("release body: " + ($End - $Start) + " 行（" + $Ver + " 段）")
          } else {
            Write-Output ("警告：CHANGELOG.md 未找到 [" + $Ver + "] 段，Release body 留空")
          }

      - name: 下载 Chromium 固化专属浏览器资产（独立 zip，主包不携带——升级不重下）
        shell: pwsh
        run: |
          # Chromium 官方快照（Windows x64）；钉死版本，桥侧按资产名前缀识别。
          $Position = "1710741"  # npmmirror 实测存在的最新快照（2026-10 验证）
          $Url = "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/$Position/chrome-win.zip"
          try {
            Invoke-WebRequest -Uri $Url -OutFile chromium-raw.zip -MaximumRedirection 5
          } catch {
            # 官方源不可达时走 npmmirror 国内镜像（同 snap 体系）。
            $Url2 = "https://registry.npmmirror.com/-/binary/chromium-browser-snapshots/win_x64/$Position/chrome-win.zip"
            Invoke-WebRequest -Uri $Url2 -OutFile chromium-raw.zip
          }
          Expand-Archive -Path chromium-raw.zip -DestinationPath chromium-stage -Force
          Compress-Archive -Path chromium-stage/chrome-win -DestinationPath queqiao-browser-$Position-win64.zip -Force
          "browser_asset=queqiao-browser-$Position-win64.zip" | Out-File -Append $env:GITHUB_ENV
          Write-Output "browser asset: queqiao-browser-$Position-win64.zip"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            queqiao-v*-win64.zip
            queqiao-browser-*-win64.zip
          # 更新日志正文（组包步骤生成；文件不存在时 action 会忽略 body_path）。
          body_path: release-body.md

      # 主包镜像到 Gitee（国内下载加速）：经 gitee-sync 云函数中转（香港
      # Region，专治 runner 直传 Gitee 跨洲超时）。只镜像主包——Gitee 单附件
      # 上限 100MB（browser 资产 352MB 上不去）。secrets 未配置时跳过不阻塞
      # （可选增强；GITEE_SYNC_URL/SYNC_SECRET 与 DeepSeek-Otter 仓库同款约定）。
      - name: 同步主包到 Gitee（云函数中转，可选）
        # 注意：step 级 if 不能引用本 step 的 env（Otter 同款教训）——判空放脚本内。
        env:
          GITEE_SYNC_URL: ${{ secrets.GITEE_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        shell: bash
        run: |
          if [ -z "${GITEE_SYNC_URL}" ] || [ -z "${SYNC_SECRET}" ]; then
            echo "未配置 GITEE_SYNC_URL/SYNC_SECRET secrets，跳过 Gitee 同步（可选增强）"
            exit 0
          fi
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          MAIN_ASSET="queqiao-v${VERSION}-win64.zip"
          echo "同步 ${MAIN_ASSET} → Gitee（云函数中转）"
          # -G --data-urlencode：secret 含 +/&/空格等字符时直拼 URL 会被网关解码变形
          code=$(curl -s -o gitee-sync-resp.json -w "%{http_code}" --max-time 600 -G             --data-urlencode "secret=${SYNC_SECRET}"             --data-urlencode "version=${VERSION}"             --data-urlencode "gh_repo=linxunxr/QueQiao"             --data-urlencode "owner=mwcxlinxun"             --data-urlencode "repo=QueQiao"             --data-urlencode "files=${MAIN_ASSET}"             "${GITEE_SYNC_URL}")
          cat gitee-sync-resp.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Gitee 同步未成功（HTTP ${code}）——不阻塞发版，GitHub 源不受影响；可手动重跑本步（云函数幂等）"
          fi
