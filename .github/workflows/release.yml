# Release：打 v* tag 时构建并上传 Windows 产物到 GitHub Release。
# 产物只含本仓库 MIT 代码编译的 exe 与配套脚本/声明——不包含、不下载、
# 不内嵌 SnowLuma 任何组件（A 档授权边界：不捆绑进第三方安装包；
# SnowLuma 由使用者自行从官方渠道获取，见包内安装说明）。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '追加产物的已有 tag（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 产物并上传 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建（release，全 workspace 含客户端）
        run: cargo build --release

      - name: 真桥 exe 拷入客户端 bundle 资源（覆盖占位）
        shell: pwsh
        run: |
          Copy-Item target/release/queqiao.exe crates/queqiao-app/binaries/ -Force
          Copy-Item target/release/queqiao-mcp.exe crates/queqiao-app/binaries/ -Force

      - name: 组包
        shell: pwsh
        run: |
          $Tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $Stage = "stage/$Tag"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          # 双 exe + 部署脚本 + 许可与声明（宽松许可的声明保留义务随二进制履行）。
          Copy-Item target/release/queqiao.exe $Stage
          Copy-Item target/release/queqiao-mcp.exe $Stage
          Copy-Item target/release/queqiao-app.exe $Stage
          Copy-Item install.ps1 $Stage
          Copy-Item install.bat $Stage
          Copy-Item upgrade.bat $Stage
          New-Item -ItemType Directory -Force -Path "$Stage/scripts" | Out-Null
          Copy-Item scripts/upgrade.ps1 "$Stage/scripts/"
          # preset 随包分发（安装器部署到 ~/.dsh/agent-presets）。
          New-Item -ItemType Directory -Force -Path "$Stage/dsh/agent-presets" | Out-Null
          Copy-Item dsh/agent-presets/* "$Stage/dsh/agent-presets/" -Recurse
          Copy-Item LICENSE $Stage
          Copy-Item THIRD_PARTY_NOTICES.md $Stage
          Copy-Item migrate-from-node.ps1 $Stage
          @'
          鹊桥（QueQiao）安装说明
          ========================

          本包只包含鹊桥自身（MIT 许可）的可执行文件与部署脚本。
          运行需要自备以下组件（本包不含、也不代替你获取它们）：

          1. SnowLuma 官方发行包——从官方渠道下载安装（见 README 链接），
             登录目标 QQ 并开启 OneBot 服务；使用者须遵守 SnowLuma EULA/LICENSE。
          2. DeepSeek Harness（DSH）——已安装并初始化（~/.dsh 存在）。
          3. config.json——参照仓库 README「快速上手」准备，放到 exe 同目录。

          全新安装：解压后双击 install.bat（引导安装 DSH/SnowLuma、部署 preset、
          生成 config、注册 MCP；也可命令行 install.ps1，参数见脚本头部）
          升级部署：双击 upgrade.bat
          （构建 + dist 布局 + DSH preset 注册；也可直接用本包已构建的 exe）。
          详见仓库 README：https://github.com/linxunxr/QueQiao
          # 文件名用 ASCII：PS5.1 Compress-Archive 不打 UTF-8 名标志，中文名
          # 在非中文系统解压乱码（内容仍是中文）。
          '@ | Out-File "$Stage/INSTALL-NOTES.txt" -Encoding utf8
          Compress-Archive -Path "$Stage/*" -DestinationPath "queqiao-$Tag-win64.zip" -Force
          Get-Item "queqiao-$Tag-win64.zip"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: queqiao-*-win64.zip
